name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: malmoa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d malmoa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/malmoa
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      GEMINI_API_KEY: ''
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test package
      - name: Verify PostgreSQL migrations and backend startup
        run: |
          java -jar target/malmoa-personalization-backend-0.1.0.jar > /tmp/malmoa-backend.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/health/ready > /tmp/readiness.json; then
              break
            fi
            sleep 2
          done

          cat /tmp/readiness.json || true
          curl --fail --silent http://localhost:8080/api/health
          grep -q '"database":"ok"' /tmp/readiness.json
          curl --fail --silent http://localhost:8080/api/users/1/personalization-context > /tmp/context.json
          grep -q '"userId":1' /tmp/context.json
